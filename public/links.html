<!doctype html>
<html lang="en-GB" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zawadi London | Links</title>
<meta name="description" content="Personalised frames, stitched and embroidered pictures from Zawadi London. Order on Etsy, see our work or make a custom enquiry.">
<meta name="theme-color" content="#023624">
<meta property="og:title" content="Zawadi London">
<meta property="og:description" content="Made from moments… Made to cherish…">
<meta property="og:image" content="assets/img/brand/post-tagline.jpg">
<link rel="icon" type="image/png" href="assets/img/brand/favicon.png">
<link rel="apple-touch-icon" href="assets/img/brand/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #023624;
    --white: #ffffff;
    --muted: rgba(255, 255, 255, 0.78);
    --hairline: rgba(255, 255, 255, 0.24);
    --serif: "Cormorant Garamond", "Cormorant", Georgia, serif;
    --ease: cubic-bezier(.2, .7, .1, 1);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100svh; background: var(--green); color: var(--white);
    font-family: var(--serif); font-size: 19px; line-height: 1.5; -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  a { color: inherit; }
  img, video { display: block; max-width: 100%; height: auto; }
  :focus-visible { outline: 1.5px solid var(--white); outline-offset: 4px; }

  .page { width: 100%; max-width: 440px; min-height: 100svh; margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom)); position: relative; display: flex; flex-direction: column; }
  .intro { margin-top: auto; }
  .foot { margin-top: auto; }
  .lockup { display: block; width: 168px; margin: 0 auto 28px; }
  .lockup img { width: 100%; }
  .statement { font-size: 19px !important; white-space: nowrap; letter-spacing: .01em; font-weight: 300; color: var(--white) !important; margin-bottom: 10px !important; }

  /* Big faint Z behind everything */
  .bg-z { position: fixed; width: 150vw; max-width: 900px; left: 50%; top: 46%; transform: translate(-50%, -50%); opacity: .045; pointer-events: none; z-index: 0; }
  .page > * { position: relative; z-index: 1; }

  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .top img { width: 46px; }
  .share { background: none; border: 1px solid var(--hairline); color: var(--white); width: 44px; height: 44px; display: grid; place-items: center; cursor: pointer; border-radius: 2px; transition: background .3s, color .3s; }
  .share:hover { background: var(--white); color: var(--green); }
  .share svg { width: 18px; height: 18px; }

  /* Hero: framed looping video */
  .hero { position: relative; aspect-ratio: 1; overflow: hidden; margin-bottom: 28px; }
  .hero video, .hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .hero::after { content: ""; position: absolute; inset: 10px; border: 1px solid rgba(255,255,255,.55); pointer-events: none; }
  .hero-tag {
    position: absolute; left: 0; bottom: 22px; background: var(--white); color: var(--green);
    padding: 12px 18px; display: flex; flex-direction: column; line-height: 1.15;
  }
  .hero-tag b { font-weight: 400; font-size: 26px; }
  .hero-tag span { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; }

  .intro { text-align: center; margin-bottom: 36px; }
  .intro h1 { margin: 0; font-weight: 300; font-size: 15px; letter-spacing: .3em; text-transform: uppercase; }
  .intro .tagline { margin: 10px 0 6px; font-style: italic; font-weight: 300; font-size: 32px; line-height: 1.25; }
  .intro p { margin: 0; color: var(--muted); font-size: 18px; }

  /* Links */
  .links { list-style: none; margin: 0 0 48px; padding: 0; display: grid; gap: 12px; }
  .link {
    position: relative; display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 10px 18px 10px 10px;
    text-decoration: none; border: 1px solid var(--hairline); border-radius: 2px; overflow: hidden; isolation: isolate;
    transition: color .45s var(--ease), border-color .45s var(--ease);
  }
  .link::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--white); transform: translateX(-101%); transition: transform .5s var(--ease); }
  .link:hover, .link:focus-visible { color: var(--green); border-color: var(--white); }
  .link:hover::before, .link:focus-visible::before { transform: none; }
  .link .ico { width: 44px; height: 44px; flex: none; display: grid; place-items: center; overflow: hidden; }
  .link .ico img { width: 100%; height: 100%; object-fit: cover; }
  .link .ico svg { width: 22px; height: 22px; }
  .link .txt { flex: 1; display: flex; flex-direction: column; line-height: 1.2; }
  .link .txt b { font-weight: 400; font-size: 22px; }
  .link .txt small { font-size: 15px; color: var(--muted); transition: color .45s var(--ease); }
  .link:hover .txt small, .link:focus-visible .txt small { color: rgba(2,54,36,.72); }
  .link .go { font-size: 20px; transition: transform .45s var(--ease); }
  .link:hover .go { transform: translateX(4px); }
  .link--main { background: var(--white); color: var(--green); border-color: var(--white); }
  .link--main::before { background: var(--green); }
  .link--main:hover, .link--main:focus-visible { color: var(--white); }
  .link--main .txt small { color: rgba(2,54,36,.72); }
  .link--main:hover .txt small { color: var(--muted); }

  /* Pieces strip (from the CMS) */
  .label { font-size: 13px; letter-spacing: .24em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; display: flex; justify-content: space-between; }
  .label a { text-decoration: none; border-bottom: 1px solid var(--hairline); }
  .pieces { display: grid; grid-auto-flow: column; grid-auto-columns: 62%; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -16px 32px; padding: 0 16px 4px; scrollbar-width: none; }
  .pieces::-webkit-scrollbar { display: none; }
  .piece { scroll-snap-align: start; text-decoration: none; display: block; }
  .piece .img { aspect-ratio: 4 / 5; overflow: hidden; position: relative; background: #0b4430; }
  .piece .img img { width: 100%; height: 100%; object-fit: cover; transition: transform 1s var(--ease); }
  .piece:hover .img img { transform: scale(1.05); }
  .piece .ph { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; border: 1px solid var(--hairline); }
  .piece .ph img { width: 54px; height: auto; }
  .piece .ph em { font-weight: 300; font-size: 20px; }
  .piece .cap { display: flex; justify-content: space-between; gap: 8px; padding: 10px 0 0; font-size: 18px; line-height: 1.25; }
  .piece .cap span { color: var(--muted); white-space: nowrap; }

  /* Instagram row */
  .ig { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 32px; }
  .ig a { aspect-ratio: 1; overflow: hidden; display: block; }
  .ig img { width: 100%; height: 100%; object-fit: cover; transition: transform 1s var(--ease); }
  .ig a:hover img { transform: scale(1.06); }

  .foot { text-align: center; border-top: 1px solid var(--hairline); padding-top: 24px; }
  .signoff { display: flex; flex-direction: column; align-items: center; gap: 2px; text-transform: uppercase; font-weight: 300; line-height: 1.2; margin-bottom: 14px; }
  .signoff b { font-weight: 300; font-size: 20px; letter-spacing: .08em; }
  .signoff small { font-size: 12px; letter-spacing: .12em; }
  .foot p { margin: 0 0 4px; font-size: 14px; color: var(--muted); }
  .credit { letter-spacing: .12em; text-transform: uppercase; font-size: 11px !important; }
  .credit a { text-decoration: underline; text-underline-offset: 3px; display: inline-block; padding: 14px 6px; margin: -14px -6px; }

  .toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); background: var(--white); color: var(--green); padding: 10px 18px; font-size: 14px; letter-spacing: .14em; text-transform: uppercase; opacity: 0; transition: opacity .3s, transform .3s var(--ease); z-index: 10; pointer-events: none; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* Entrance */
  .rise { opacity: 0; transform: translateY(18px); animation: rise .9s var(--ease) forwards; animation-delay: calc(var(--i, 0) * 70ms + 100ms); }
  @keyframes rise { to { opacity: 1; transform: none; } }
  .no-js .rise { opacity: 1; transform: none; animation: none; }
  @media (prefers-reduced-motion: reduce) {
    .rise { opacity: 1; transform: none; animation: none; }
    *, *::before, *::after { transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<img class="bg-z" src="assets/img/brand/mark-white.png" alt="" aria-hidden="true">
<main class="page">
  <div class="top rise" style="--i:0">
    <span></span>
    <button class="share" type="button" aria-label="Share this page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12 15V3m0 0L7.5 7.5M12 3l4.5 4.5M5 12v7.5h14V12"/></svg>
    </button>
  </div>

  <div class="intro">
    <a class="lockup rise" style="--i:1" href="index.html" aria-label="Zawadi London website"><img src="assets/img/brand/lockup-white.png" alt="Zawadi London" width="691" height="782"></a>
    <p class="tagline rise" style="--i:2">Made from moments…<br>Made to cherish…</p>
    <p class="rise" style="--i:3">Personalised keepsakes, made especially for you.</p>
  </div>

  <ul class="links">
    <li class="rise" style="--i:4"><a class="link link--main" href="https://zawadilondon.etsy.com" target="_blank" rel="noopener">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M5 8h14l-1.2 12H6.2L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg></span>
      <span class="txt"><b>Order on Etsy</b><small>zawadilondon.etsy.com</small></span><span class="go" aria-hidden="true">→</span></a></li>
    <li class="rise" style="--i:5"><a class="link" href="https://www.instagram.com/zawadildn" target="_blank" rel="noopener">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4.5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r=".6" fill="currentColor"/></svg></span>
      <span class="txt"><b>Instagram</b><small>@zawadildn</small></span><span class="go" aria-hidden="true">→</span></a></li>
    <li class="rise" style="--i:6"><a class="link" href="mailto:zawadildn@gmail.com">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="5.5" width="18" height="13"/><path d="m3.5 6 8.5 7 8.5-7"/></svg></span>
      <span class="txt"><b>Email us</b><small>zawadildn@gmail.com</small></span><span class="go" aria-hidden="true">→</span></a></li>
  </ul>

  <footer class="foot rise" style="--i:7">
    <p class="statement">Your Moment. Your Story. Your ZAWADI.</p>
    <p class="credit">Developed &amp; designed by <a href="https://naavcaptured.com" target="_blank" rel="noopener">naavcaptured</a></p>
  </footer>
</main>
<div class="toast" role="status" aria-live="polite">Link copied</div>

<script>
(function () {
  "use strict";
  document.documentElement.classList.remove("no-js");
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

  /* Share / copy link */
  var toast = document.querySelector(".toast");
  document.querySelector(".share").addEventListener("click", function () {
    var data = { title: "Zawadi London", text: "Made from moments… Made to cherish…", url: location.href };
    if (navigator.share) { navigator.share(data).catch(function () {}); return; }
    function shown() { toast.classList.add("show"); setTimeout(function () { toast.classList.remove("show"); }, 1800); }
    if (navigator.clipboard) navigator.clipboard.writeText(location.href).then(shown, shown); else shown();
  });

})();
</script>
</body>
</html>
